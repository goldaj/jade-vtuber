name: Jade rebuild offline tests

# Superseded commits on the same PR/branch must not consume both runner pools.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # The documentation PR gate needs a true merge base with the target.
          fetch-depth: 0
          persist-credentials: false
      - name: Parse Windows launcher scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $files = @('scripts/jade-launcher.ps1', 'scripts/jade-runner.ps1', 'scripts/install-jade-launcher.ps1', 'scripts/install-jade-control.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.ToString() }
              exit 1
            }
          }
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fast tracked-source preflight (no dependencies or provider calls)
        run: python tools/jade_ci_preflight.py
      - name: Install locked dependencies including optional transports
        run: |
          python -m pip install --disable-pip-version-check poetry==2.2.1
          poetry sync --only main --extras discord --extras mic --extras vts --extras discord-voice --no-interaction
          poetry run python -m pip install --disable-pip-version-check tzdata
      - name: Compile Python
        run: poetry run python -m compileall -q src main.py
      - name: Browser Live2D visibility lifecycle
        run: |
          node --check src/jade_runtime/mobile_web/app.js
          node --check src/jade_runtime/mobile_web/login-guard.js
          node tests/mobile_login_flow_test.js
          node --check src/jade_runtime/mobile_web/avatar-models.js
          node --check src/jade_runtime/mobile_web/avatar-model-loader.js
          node tests/mobile_avatar_models_test.js
          node tests/mobile_avatar_model_loader_test.js
          node tests/mobile_avatar_lifecycle_test.js
          node --check src/jade_runtime/mobile_web/avatar.js
          node tests/mobile_avatar_visibility_test.js
          node tests/mobile_scene_framing_test.js
          node tests/mobile_scene_gestures_test.js
          node --check src/jade_runtime/mobile_web/room-motion.js
          node tests/mobile_room_selection_test.js
          node --check src/jade_runtime/mobile_web/seated-scene.js
          node tests/seated_scene_test.js
          node --check src/jade_runtime/mobile_web/portrait-bedroom-motion.js
          node tests/portrait_bedroom_motion_test.js
          node --check src/jade_runtime/mobile_web/head-isolation.js
          node tests/mobile_head_isolation_test.js
          node tests/room_motion_test.js
      - name: Run offline unit tests
        run: poetry run python -m unittest discover -s tests -v
      - name: Documentation contract
        run: poetry run python scripts/check_docs.py
      - name: Demo Express PowerShell parser and offline smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('demo/express/Jade-Demo-Express.ps1', 'demo/express/Installer-Demo-Express.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          powershell.exe -NoLogo -NoProfile -File demo/express/Jade-Demo-Express.ps1 -SelfTest
      - name: Demo CLI smoke (must never call OpenAI)
        shell: bash
        run: |
          printf '/exit\n' | poetry run python main.py
      - name: Check non-OpenAI voice dependencies are absent
        shell: bash
        run: |
          python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              package = tomllib.load(f)
          names = set(package["tool"]["poetry"]["dependencies"])
          assert not names.intersection({"elevenlabs", "google-cloud-texttospeech",
              "speechrecognition", "whisper", "faster-whisper", "pyttsx3"})
          PY
