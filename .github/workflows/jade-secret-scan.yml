name: Jade secret scan

# Every run examines fetched history. Newer branch/PR runs supersede old ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v4.2.2, pinned to its commit; retrieve all branch/tag history and the
      # pull-request merge commit. No repository token remains in git config.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/jade-gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$archive"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "${RUNNER_TEMP}" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
      - name: Check the scanner with a synthetic historical secret
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: python3 tools/jade_gitleaks_selftest.py
      - name: Scan all fetched Git history
        shell: bash
        run: |
          set -euo pipefail
          scan_output="$(mktemp "${RUNNER_TEMP}/jade-scan.XXXXXX")"
          scan_report="$(mktemp "${RUNNER_TEMP}/jade-report.XXXXXX")"
          trap 'rm -f "$scan_output" "$scan_report"' EXIT
          # --all covers fetched branches and tags; HEAD also covers a detached
          # PR merge commit. No finding values, line contents or fingerprints are printed.
          if ! "${RUNNER_TEMP}/gitleaks" git --log-opts='--all HEAD' --redact=100 --no-banner --exit-code=1 \
            --report-format=json --report-path "$scan_report" >"$scan_output" 2>&1; then
            python3 - "$scan_report" <<'PY'
          import json
          import re
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as report:
                  findings = json.load(report)
              # Metadata only: no Secret, Match, Line, Fingerprint or commit diff.
              pairs = sorted({(entry.get("RuleID", ""), entry.get("File", ""))
                              for entry in findings if isinstance(entry, dict)})
              for rule, filename in pairs[:20]:
                  safe_rule = re.sub(r"[^A-Za-z0-9_-]", "_", rule)[:80]
                  safe_path = re.sub(r"[^A-Za-z0-9_./-]", "_", filename)[:150]
                  print(f"Scanner rule={safe_rule} path={safe_path}")
              print(f"Scanner finding count={len(findings)}")
          except (OSError, ValueError, TypeError):
              print("Scanner report unavailable")
          PY
            echo 'Secret scan failed or found a possible secret. Never paste findings into logs.' >&2
            exit 1
          fi
          echo 'Fetched Git history passed the secret scan.'
          # Git LFS pointers, not LFS object bytes, are scanned by git mode.
