name: DEV-010 final scoped quality gate
on:
  push:
    branches:
      - feature/dev-010-living-room-20261122
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source preflight
        run: python tools/jade_ci_preflight.py
      - name: Documentation contract and backlog integrity
        run: python scripts/check_docs.py
      - name: JavaScript parse and lifecycle regression
        run: |
          node --check src/jade_runtime/mobile_web/room-motion.js
          node tests/room_motion_test.js
      - name: Install image build dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-room-layers.txt
      - name: Validate generated artifact and static geometry
        run: python tests/room_layers_build_test.py
