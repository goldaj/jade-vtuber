name: Jade economic interaction offline tests
on:
  pull_request:
    paths:
      - "src/jade_runtime/**"
      - "src/utility/**"
      - "main.py"
      - "tests/**"
      - ".github/workflows/jade-economy-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -e . tzdata
      - name: Compile Python
        run: python -m compileall -q src main.py tests
      - name: Browser JavaScript syntax and streaming behavior
        run: |
          node --check src/jade_runtime/mobile_web/app.js
          node --check src/jade_runtime/mobile_web/duplex-client.js
          node tests/mobile_stream_client_test.js
          node --check src/jade_runtime/mobile_web/avatar.js
          node tests/mobile_avatar_visibility_test.js
      - name: Offline unit and contract tests
        run: python -m unittest discover -s tests -v
