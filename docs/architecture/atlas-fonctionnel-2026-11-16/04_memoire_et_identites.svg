<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.4"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#1d465d" stroke="#1d465d" stroke-width="1.4"/><text x="50" y="61" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#172b3d">04 · MÉMOIRE ET IDENTITÉS</text><text x="50" y="92" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#5a7180">L’historique exact et la création de souvenirs sont deux processus distincts.</text><line x1="50" y1="111" x2="1550" y2="111" stroke="#cbd7e0"/><rect x="50" y="126" width="74" height="29" rx="14" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="62" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">LOCAL</text><rect x="136" y="126" width="134" height="29" rx="14" fill="#fff3e6" stroke="#c1892c" stroke-width="1.4"/><text x="148" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">IA DISTANTE</text><rect x="282" y="126" width="204" height="29" rx="14" fill="#eaf3ff" stroke="#4d8db8" stroke-width="1.4"/><text x="294" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">STT / TTS / RÉSEAU</text><rect x="498" y="126" width="114" height="29" rx="14" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="510" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">CONDITION</text><rect x="624" y="126" width="124" height="29" rx="14" fill="#fff0f0" stroke="#bb6767" stroke-width="1.4"/><text x="636" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">ASYNCHRONE</text><rect x="50" y="178" width="478" height="178" rx="12" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="67" y="210" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">1 · IDENTIFIER</text><text x="67" y="244" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Micro / Android : Goldaj privé</text><text x="67" y="268" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Discord / Twitch : comptes propres</text><text x="67" y="292" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">HTTP : pas de profil mémoire durable</text><text x="67" y="316" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">La portée suit l’identité vérifiée</text><path d="M530,267 L555,267" stroke="#23465d" stroke-width="2.3" fill="none" /><polygon points="555,267 547,262 547,272" fill="#23465d"/><rect x="558" y="178" width="478" height="178" rx="12" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="575" y="210" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">2 · LIRE</text><text x="575" y="244" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Historique volatil en RAM</text><text x="575" y="268" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Échanges exacts SQL si opt-in</text><text x="575" y="292" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Souvenirs du bon compte et canal</text><text x="575" y="316" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Ne pas importer un souvenir tiers</text><path d="M1038,267 L1063,267" stroke="#23465d" stroke-width="2.3" fill="none" /><polygon points="1063,267 1055,262 1055,272" fill="#23465d"/><rect x="1066" y="178" width="478" height="178" rx="12" fill="#eaf3ff" stroke="#4d8db8" stroke-width="1.4"/><text x="1083" y="210" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">3 · CONTEXTE</text><text x="1083" y="244" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Persona + demande + mémoire</text><text x="1083" y="268" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Souvenirs traités comme données</text><text x="1083" y="292" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Appel dialogue distant → intention</text><text x="1083" y="316" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Réponse valide ou abandon</text><text x="50" y="402" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#172b3d">APRÈS LA RÉPONSE · DEUX SUITES INDÉPENDANTES</text><rect x="50" y="424" width="1500" height="231" rx="15" fill="#f7fafc" stroke="#a7bdca" stroke-width="1.4"/><text x="71" y="457" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d5c50">A · HISTORIQUE EXACT (LOCAL)</text><rect x="71" y="479" width="469" height="151" rx="12" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="88" y="511" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Vérifier</text><text x="88" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Compte reconnu ? Consentement ?</text><text x="88" y="569" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Tour admissible et non annulé ?</text><path d="M542,555 L566,555" stroke="#23465d" stroke-width="2.3" fill="none" /><polygon points="566,555 558,550 558,560" fill="#23465d"/><rect x="571" y="479" width="469" height="151" rx="12" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="588" y="511" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Enregistrer</text><text x="588" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Question + réponse, sans résumé</text><text x="588" y="569" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">SQLite local si opt-in</text><path d="M1042,555 L1066,555" stroke="#23465d" stroke-width="2.3" fill="none" /><polygon points="1066,555 1058,550 1058,560" fill="#23465d"/><rect x="1071" y="479" width="469" height="151" rx="12" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="1088" y="511" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Réutiliser</text><text x="1088" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Au maximum 24 tours restaurés</text><text x="1088" y="569" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Jamais toute la base dans le prompt</text><rect x="50" y="682" width="1500" height="340" rx="15" fill="#f7fafc" stroke="#a7bdca" stroke-width="1.4"/><text x="72" y="714" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#865e1c">B · SÉLECTION DE SOUVENIRS IMPORTANTS (ASYNCHRONE)</text><rect x="71" y="736" width="469" height="246" rx="12" fill="#fff3e6" stroke="#c1892c" stroke-width="1.4"/><text x="88" y="768" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Déclencher ?</text><text x="88" y="802" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Curateur activé ?</text><text x="88" y="826" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Identité consentante ?</text><text x="88" y="850" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Capacité disponible ?</text><text x="88" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Non → aucun appel au modèle</text><text x="88" y="898" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Oui → tâche indépendante</text><path d="M541,860 L566,860" stroke="#866bb2" stroke-width="2.3" fill="none" stroke-dasharray="6 5"/><polygon points="566,860 558,855 558,865" fill="#866bb2"/><rect x="571" y="736" width="469" height="246" rx="12" fill="#fff3e6" stroke="#c1892c" stroke-width="1.4"/><text x="588" y="768" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Appel IA distant</text><text x="588" y="802" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Envoyer demande et réponse</text><text x="588" y="826" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Choix : aucun / ordinaire / fondateur</text><text x="588" y="850" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Retour : résumé, sens, preuve</text><text x="588" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Le dialogue principal est déjà terminé</text><text x="588" y="898" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Nouvel aller-retour facturable</text><path d="M1041,860 L1066,860" stroke="#866bb2" stroke-width="2.3" fill="none" stroke-dasharray="6 5"/><polygon points="1066,860 1058,855 1058,865" fill="#866bb2"/><rect x="1071" y="736" width="469" height="246" rx="12" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="1088" y="768" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Vérifier puis écrire</text><text x="1088" y="802" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Citation exacte, format, longueur</text><text x="1088" y="826" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Contrôle des secrets et données sensibles</text><text x="1088" y="850" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Identité et consentement revérifiés</text><text x="1088" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Invalide → aucun souvenir</text><text x="1088" y="898" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">Valide → SQLite local</text><rect x="50" y="1051" width="1500" height="47" rx="10" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="68" y="1082" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#172b3d">Autres opérations : activer la mémoire, consulter, effacer, oublier, lier / dissocier des identités, corriger un souvenir.</text></svg>