eight="78" rx="5" fill="#edf8f5" stroke="#a7bdca" stroke-width="1.4"/><text x="63" y="712" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#172b3d">Android privé</text><rect x="371" y="681" width="346" height="78" rx="5" fill="#edf8f5" stroke="#a7bdca" stroke-width="1.4"/><text x="384" y="712" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#172b3d">PWA : texte + intention</text><rect x="717" y="681" width="363" height="78" rx="5" fill="#edf8f5" stroke="#a7bdca" stroke-width="1.4"/><text x="730" y="712" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#172b3d">TTS distant à la demande</text><rect x="1080" y="681" width="470" height="78" rx="5" fill="#edf8f5" stroke="#a7bdca" stroke-width="1.4"/><text x="1093" y="712" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#172b3d">Audio et modèle Web sur l’appareil</text><text x="50" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#172b3d">ÉCHECS ET CONTRÔLES</text><rect x="50" y="839" width="365" height="134" rx="12" fill="#fff0f0" stroke="#bb6767" stroke-width="1.4"/><text x="67" y="873" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#172b3d">01 · ENTRÉE</text><text x="67" y="909" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Bruit, doublon, longueur, surcharge :</text><text x="67" y="933" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">ne pas déclencher le dialogue.</text><rect x="431" y="839" width="365" height="134" rx="12" fill="#fff0f0" stroke="#bb6767" stroke-width="1.4"/><text x="448" y="873" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#172b3d">02 · INFÉRENCE</text><text x="448" y="909" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Arbitre lent → repli local.</text><text x="448" y="933" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Dialogue expiré → abandon.</text><rect x="812" y="839" width="365" height="134" rx="12" fill="#fff0f0" stroke="#bb6767" stroke-width="1.4"/><text x="829" y="873" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#172b3d">03 · AUDIO</text><text x="829" y="909" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Session interrompue ou déplacée :</text><text x="829" y="933" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">couper le flux et nettoyer OBS.</text><rect x="1193" y="839" width="365" height="134" rx="12" fill="#fff0f0" stroke="#bb6767" stroke-width="1.4"/><text x="1210" y="873" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#172b3d">04 · SUIVI</text><text x="1210" y="909" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Sorties facultatives parfois en échec.</text><text x="1210" y="933" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Journal = destination prévue.</text><rect x="50" y="996" width="1500" height="91" rx="12" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="70" y="1027" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">TÂCHES HORS BOUCLE DE CONVERSATION</text><text x="70" y="1058" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#172b3d">Connexions, reconnexions, jetons Twitch, sauvegardes privées, OBS, CI, diagnostic, fermeture et ressources Live2D.</text></svg>