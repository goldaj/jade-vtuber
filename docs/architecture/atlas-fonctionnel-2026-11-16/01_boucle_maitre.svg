<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.4"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#1d465d" stroke="#1d465d" stroke-width="1.4"/><text x="50" y="61" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#172b3d">01 · BOUCLE FONCTIONNELLE COMPLÈTE</text><text x="50" y="92" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#5a7180">Entrées et arbitrage → dialogue → sorties → mémoire ; les spécificités détaillées figurent dans les quatre vues suivantes.</text><line x1="50" y1="111" x2="1550" y2="111" stroke="#cbd7e0"/><rect x="50" y="126" width="74" height="29" rx="14" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="62" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">LOCAL</text><rect x="136" y="126" width="134" height="29" rx="14" fill="#fff3e6" stroke="#c1892c" stroke-width="1.4"/><text x="148" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">IA DISTANTE</text><rect x="282" y="126" width="204" height="29" rx="14" fill="#eaf3ff" stroke="#4d8db8" stroke-width="1.4"/><text x="294" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">STT / TTS / RÉSEAU</text><rect x="498" y="126" width="114" height="29" rx="14" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="510" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">CONDITION</text><rect x="624" y="126" width="124" height="29" rx="14" fill="#fff0f0" stroke="#bb6767" stroke-width="1.4"/><text x="636" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">ASYNCHRONE</text><rect x="50" y="179" width="1500" height="163" rx="15" fill="#f7fafc" stroke="#cddce5" stroke-width="1.4"/><text x="67" y="205" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#193e55">A · ÉCOUTE ET PRÉSÉLECTION</text><rect x="70" y="221" width="465" height="108" rx="12" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="87" y="253" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Six sources actives</text><text x="87" y="287" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Twitch, Discord texte / vocal</text><text x="87" y="311" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Micro PC, Android privé</text><text x="87" y="335" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">HTTP local et console</text><path d="M537,275 L563,275" stroke="#23465d" stroke-width="2.3" fill="none" /><polygon points="563,275 555,270 555,280" fill="#23465d"/><rect x="567" y="221" width="465" height="108" rx="12" fill="#eaf3ff" stroke="#4d8db8" stroke-width="1.4"/><text x="584" y="253" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Normaliser / transcrire</text><text x="584" y="287" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Audio → segment local → STT distant</text><text x="584" y="311" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Texte → normalisation locale</text><text x="584" y="335" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Retour de transcription vers le PC</text><path d="M1034,275 L1060,275" stroke="#23465d" stroke-width="2.3" fill="none" /><polygon points="1060,275 1052,270 1052,280" fill="#23465d"/><rect x="1064" y="221" width="465" height="108" rx="12" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="1081" y="253" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Le canal doit-il répondre ?</text><text x="1081" y="287" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Identité, bruit, mentions, contexte</text><text x="1081" y="311" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Règles et tirage 30 % si applicable</text><text x="1081" y="335" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Non → ignorer / contexte passif</text><path d="M 809 342 L 809 354" stroke="#23465d" stroke-width="2.5"/><polygon points="809,352 803,343 815,343" fill="#23465d"/><rect x="50" y="354" width="1500" height="163" rx="15" fill="#f7fafc" stroke="#cddce5" stroke-width="1.4"/><text x="67" y="380" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#193e55">B · FILE ET ARBITRAGE</text><rect x="70" y="396" width="465" height="108" rx="12" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="87" y="428" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Déposer le tour</text><text x="87" y="462" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">File bornée commune</text><text x="87" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Un seul dialogue principal à la fois</text><text x="87" y="510" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Les connecteurs restent à l’écoute</text><path d="M537,450 L563,450" stroke="#23465d" stroke-width="2.3" fill="none" /><polygon points="563,450 555,445 555,455" fill="#23465d"/><rect x="567" y="396" width="465" height="108" rx="12" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="584" y="428" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Plusieurs tours attendent ?</text><text x="584" y="462" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Non → choisir le premier</text><text x="584" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Oui → tester attente, expiration</text><text x="584" y="510" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Préserver la continuité des échanges</text><path d="M1034,450 L1060,450" stroke="#23465d" stroke-width="2.3" fill="none" /><polygon points="1060,450 1052,445 1052,455" fill="#23465d"/><rect x="1064" y="396" width="465" height="108" rx="12" fill="#fff3e6" stroke="#c1892c" stroke-width="1.4"/><text x="1081" y="428" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Choisir la priorité</text><text x="1081" y="462" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Si nécessaire : appel IA distant</text><text x="1081" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Retour de l’identifiant du tour</text><text x="1081" y="510" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Échec / urgence → arbitrage local</text><path d="M 809 517 L 809 529" stroke="#23465d" stroke-width="2.5"/><polygon points="809,527 803,518 815,518" fill="#23465d"/><rect x="50" y="529" width="1500" height="163" rx="15" fill="#f7fafc" stroke="#cddce5" stroke-width="1.4"/><text x="67" y="555" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#193e55">C · CONTEXTE ET DIALOGUE</text><rect x="70" y="571" width="465" height="108" rx="12" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="87" y="603" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Commande spéciale ?</text><text x="87" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Commande mémoire → voie locale</text><text x="87" y="661" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Sinon : dialogue normal</text><text x="87" y="685" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Déduplication et validité du tour</text><path d="M537,625 L563,625" stroke="#23465d" stroke-width="2.3" fill="none" /><polygon points="563,625 555,620 555,630" fill="#23465d"/><rect x="567" y="571" width="465" height="108" rx="12" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="584" y="603" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Assembler le contexte</text><text x="584" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Personnalité + demande</text><text x="584" y="661" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Historique et souvenirs autorisés</text><text x="584" y="685" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Données du bon compte et canal</text><path d="M1034,625 L1060,625" stroke="#23465d" stroke-width="2.3" fill="none" /><polygon points="1060,625 1052,620 1052,630" fill="#23465d"/><rect x="1064" y="571" width="465" height="108" rx="12" fill="#fff3e6" stroke="#c1892c" stroke-width="1.4"/><text x="1081" y="603" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Inférence et intention</text><text x="1081" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Appel IA distant → texte + intention</text><text x="1081" y="661" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Vérifier l’étiquette et la retirer</text><text x="1081" y="685" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Erreur / annulation → pas de sortie</text><path d="M 809 692 L 809 704" stroke="#23465d" stroke-width="2.5"/><polygon points="809,702 803,693 815,693" fill="#23465d"/><rect x="50" y="704" width="1500" height="163" rx="15" fill="#f7fafc" stroke="#cddce5" stroke-width="1.4"/><text x="67" y="730" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#193e55">D · SORTIES ET RETOURS</text><rect x="70" y="746" width="465" height="108" rx="12" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="87" y="778" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Déterminer la diffusion</text><text x="87" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Canal d’origine et confidentialité</text><text x="87" y="836" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Texte, voix, avatar, OBS possibles</text><text x="87" y="860" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Certaines sorties sont facultatives</text><path d="M537,800 L563,800" stroke="#23465d" stroke-width="2.3" fill="none" /><polygon points="563,800 555,795 555,805" fill="#23465d"/><rect x="567" y="746" width="465" height="108" rx="12" fill="#eaf3ff" stroke="#4d8db8" stroke-width="1.4"/><text x="584" y="778" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Créer la voix si permise</text><text x="584" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">TTS distant → retour audio</text><text x="584" y="836" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Lecture PC + Discord parfois parallèle</text><text x="584" y="860" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Voix anticipée : conditions strictes</text><path d="M1034,800 L1060,800" stroke="#23465d" stroke-width="2.3" fill="none" /><polygon points="1060,800 1052,795 1052,805" fill="#23465d"/><rect x="1064" y="746" width="465" height="108" rx="12" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="1081" y="778" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Diffuser sur les canaux</text><text x="1081" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Texte Twitch / Discord / PWA / HTTP</text><text x="1081" y="836" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Avatar, sous-titres OBS si autorisés</text><text x="1081" y="860" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Interruption / échec partiel possibles</text><path d="M 809 867 L 809 879" stroke="#23465d" stroke-width="2.5"/><polygon points="809,877 803,868 815,868" fill="#23465d"/><rect x="50" y="879" width="1500" height="163" rx="15" fill="#f7fafc" stroke="#cddce5" stroke-width="1.4"/><text x="67" y="905" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#193e55">E · APRÈS LA RÉPONSE</text><rect x="70" y="921" width="465" height="108" rx="12" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="87" y="953" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Conserver l’échange</text><text x="87" y="987" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Historique immédiat en mémoire vive</text><text x="87" y="1011" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Échange complet SQL si opt-in</text><text x="87" y="1035" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Tour suivant : disponibilité variable</text><path d="M537,975 L563,975" stroke="#23465d" stroke-width="2.3" fill="none" /><polygon points="563,975 555,970 555,980" fill="#23465d"/><rect x="567" y="921" width="465" height="108" rx="12" fill="#fff3e6" stroke="#c1892c" stroke-width="1.4"/><text x="584" y="953" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Choisir un souvenir ?</text><text x="584" y="987" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Option curateur + identité reconnue</text><text x="584" y="1011" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Appel IA distinct, en arrière-plan</text><text x="584" y="1035" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Le tour suivant n’attend pas ce choix</text><path d="M1034,975 L1060,975" stroke="#23465d" stroke-width="2.3" fill="none" /><polygon points="1060,975 1052,970 1052,980" fill="#23465d"/><rect x="1064" y="921" width="465" height="108" rx="12" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="1081" y="953" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172b3d">Vérifier puis conserver</text><text x="1081" y="987" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Preuve, consentement, périmètre</text><text x="1081" y="1011" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Aucun / ordinaire / fondateur</text><text x="1081" y="1035" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#172b3d">Écrire localement ou rejeter</text><rect x="50" y="1060" width="1500" height="47" rx="12" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="67" y="1089" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#172b3d">BOUCLE : la réception reste active ; la sélection des souvenirs peut se poursuivre en parallèle du tour suivant.</text></svg>