<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.4"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#1d465d" stroke="#1d465d" stroke-width="1.4"/><text x="50" y="61" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#172b3d">02 · DÉCISIONS PAR CANAL</text><text x="50" y="92" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#5a7180">Le même noyau reçoit six parcours différents. Règles, tirages et commandes locales ne sont pas des appels IA.</text><line x1="50" y1="111" x2="1550" y2="111" stroke="#cbd7e0"/><rect x="50" y="126" width="74" height="29" rx="14" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="62" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">LOCAL</text><rect x="136" y="126" width="134" height="29" rx="14" fill="#fff3e6" stroke="#c1892c" stroke-width="1.4"/><text x="148" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">IA DISTANTE</text><rect x="282" y="126" width="204" height="29" rx="14" fill="#eaf3ff" stroke="#4d8db8" stroke-width="1.4"/><text x="294" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">STT / TTS / RÉSEAU</text><rect x="498" y="126" width="114" height="29" rx="14" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="510" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">CONDITION</text><rect x="624" y="126" width="124" height="29" rx="14" fill="#fff0f0" stroke="#bb6767" stroke-width="1.4"/><text x="636" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">ASYNCHRONE</text><rect x="50" y="181" width="733" height="275" rx="15" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="72" y="219" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#172b3d">TWITCH · CHAT</text><line x1="70" y1="236" x2="761" y2="236" stroke="#bdd0dc"/><text x="74" y="266" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">1. Ignorer les messages de Jade.</text><text x="74" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">2. Tour Twitch déjà en cours ? Ignorer les autres.</text><text x="74" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">3. Un seul auteur actif sur 10 min ? Répondre.</text><text x="74" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">4. Sinon mention explicite OU tirage 30 %.</text><text x="74" y="378" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">5. Continuer à lire les PING du serveur.</text><rect x="69" y="421" width="695" height="27" rx="7" fill="#f7fafc" stroke="#a7bdca" stroke-width="1.4"/><text x="77" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#172b3d">SORTIE : texte IRC si activé ; voix selon la configuration.</text><rect x="812" y="181" width="733" height="275" rx="15" fill="#eaf3ff" stroke="#4d8db8" stroke-width="1.4"/><text x="834" y="219" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#172b3d">DISCORD · ÉCRIT</text><line x1="832" y1="236" x2="1523" y2="236" stroke="#bdd0dc"/><text x="836" y="266" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">1. Ignorer Jade ; observer les messages récents.</text><text x="836" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">2. MP / mention / réponse à Jade : répondre.</text><text x="836" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">3. Un seul humain actif ? Répondre.</text><text x="836" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">4. Groupe : suivi de conversation à 30 %.</text><text x="836" y="378" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">5. Spontané : 30 % + délai de repos 180 s.</text><text x="836" y="406" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">6. Chat du vocal : contexte passif possible.</text><rect x="831" y="421" width="695" height="27" rx="7" fill="#f7fafc" stroke="#a7bdca" stroke-width="1.4"/><text x="839" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#172b3d">SORTIE : même salon / MP ; privé jamais diffusé au public.</text><rect x="50" y="482" width="733" height="275" rx="15" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="72" y="520" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#172b3d">DISCORD · VOCAL</text><line x1="70" y1="537" x2="761" y2="537" stroke="#bdd0dc"/><text x="74" y="567" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">1. Capturer autres voix ; découper la parole.</text><text x="74" y="595" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">2. STT distant puis éliminer les fragments.</text><text x="74" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">3. Session changée, bruit ? Ignorer.</text><text x="74" y="651" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">4. Silence / reprise : gestion locale.</text><text x="74" y="679" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">5. Seul humain ou « Jade » ? Répondre.</text><text x="74" y="707" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">6. Groupe non adressé : tirage 30 %.</text><rect x="69" y="722" width="695" height="27" rx="7" fill="#f7fafc" stroke="#a7bdca" stroke-width="1.4"/><text x="77" y="741" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#172b3d">SORTIE : parole Discord ; interruption et contrôle de session.</text><rect x="812" y="482" width="733" height="275" rx="15" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="834" y="520" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#172b3d">MICROPHONE · PC</text><line x1="832" y1="537" x2="1523" y2="537" stroke="#bdd0dc"/><text x="836" y="567" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">1. Capter le microphone local.</text><text x="836" y="595" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">2. Détecter silence et prévenir l’écho.</text><text x="836" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">3. STT distant ; valider transcription.</text><text x="836" y="651" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">4. Demande directe du créateur dans la file.</text><text x="836" y="679" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">5. Attendre la fin du tour pour recapter.</text><rect x="831" y="722" width="695" height="27" rx="7" fill="#f7fafc" stroke="#a7bdca" stroke-width="1.4"/><text x="839" y="741" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#172b3d">SORTIE : voix locale, pas de diffusion Discord publique.</text><rect x="50" y="783" width="733" height="275" rx="15" fill="#eaf3ff" stroke="#4d8db8" stroke-width="1.4"/><text x="72" y="821" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#172b3d">ANDROID · PWA PRIVÉE</text><line x1="70" y1="838" x2="761" y2="838" stroke="#bdd0dc"/><text x="74" y="868" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">1. Vérifier Tailscale, propriétaire et jeton.</text><text x="74" y="896" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">2. Entrée texte ou fichier audio WAV.</text><text x="74" y="924" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">3. Si voix : STT distant puis dialogue.</text><text x="74" y="952" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">4. Une requête en cours ; délai borné.</text><text x="74" y="980" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">5. Si voulu : TTS distant après le dialogue.</text><text x="74" y="1008" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">6. Retour texte + intention + audio + avatar.</text><rect x="69" y="1023" width="695" height="27" rx="7" fill="#f7fafc" stroke="#a7bdca" stroke-width="1.4"/><text x="77" y="1042" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#172b3d">SORTIE : téléphone du propriétaire uniquement.</text><rect x="812" y="783" width="733" height="275" rx="15" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="834" y="821" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#172b3d">HTTP LOCAL / CONSOLE</text><line x1="832" y1="838" x2="1523" y2="838" stroke="#bdd0dc"/><text x="836" y="868" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">1. HTTP : vérifier jeton, taille, JSON.</text><text x="836" y="896" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">2. Console : saisie texte / simulation possible.</text><text x="836" y="924" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">3. Réponse directe dans la file commune.</text><text x="836" y="952" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">4. HTTP peut obtenir le texte avant fin audio.</text><text x="836" y="980" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#172b3d">5. Pas de profil de mémoire vérifié pour HTTP.</text><rect x="831" y="1023" width="695" height="27" rx="7" fill="#f7fafc" stroke="#a7bdca" stroke-width="1.4"/><text x="839" y="1042" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#172b3d">SORTIE : texte HTTP / console, voix PC si configurée.</text><rect x="50" y="1090" width="1495" height="26" rx="6" fill="#f7fafc" stroke="#a7bdca" stroke-width="1.4"/><text x="66" y="1109" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#172b3d">Toutes les demandes retenues rejoignent la même file de dialogue ; aucune plateforme n’a de priorité permanente.</text></svg>