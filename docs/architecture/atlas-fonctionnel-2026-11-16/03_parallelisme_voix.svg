<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.4"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#1d465d" stroke="#1d465d" stroke-width="1.4"/><text x="50" y="61" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#172b3d">03 · PARALLÉLISME ET VOIX</text><text x="50" y="92" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#5a7180">Chronologie : les transports écoutent continuellement ; le dialogue central reste sérialisé.</text><line x1="50" y1="111" x2="1550" y2="111" stroke="#cbd7e0"/><rect x="50" y="126" width="74" height="29" rx="14" fill="#edf8f5" stroke="#2e8b78" stroke-width="1.4"/><text x="62" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">LOCAL</text><rect x="136" y="126" width="134" height="29" rx="14" fill="#fff3e6" stroke="#c1892c" stroke-width="1.4"/><text x="148" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">IA DISTANTE</text><rect x="282" y="126" width="204" height="29" rx="14" fill="#eaf3ff" stroke="#4d8db8" stroke-width="1.4"/><text x="294" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">STT / TTS / RÉSEAU</text><rect x="498" y="126" width="114" height="29" rx="14" fill="#f5f0fc" stroke="#866bb2" stroke-width="1.4"/><text x="510" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">CONDITION</text><rect x="624" y="126" width="124" height="29" rx="14" fill="#fff0f0" stroke="#bb6767" stroke-width="1.4"/><text x="636" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#172b3d">ASYNCHRONE</text><text x="50" y="194" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#172b3d"