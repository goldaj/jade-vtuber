y="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#172b3d">Discord vocal + sortie PC désactivée + option active + TTS en flux : réponses reçues phrase par phrase.</text><text x="71" y="1023" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#172b3d">La génération suivante peut continuer pendant la synthèse et la lecture des phrases précédentes.</text><text x="71" y="1050" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#172b3d">Le profil tous canaux impose la lecture PC ; ne pas représenter le streaming anticipé comme systématique.</text></svg>