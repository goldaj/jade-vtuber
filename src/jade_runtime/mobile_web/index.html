<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5d45">
  <meta name="description" content="Jade, espace privé de conversation avec Goldaj.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" as="image" href="/assets/splash-jade.png" fetchpriority="high">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="stylesheet" href="/assets/login.css">
  <title>Jade · Espace privé</title>
  <!-- No room, app or Live2D is fetched before a verified login. -->
  <script src="/assets/splash.js" defer></script>
  <script src="/assets/login-guard.js" defer></script>
</head>
<body>
  <div id="jade-launch-splash" class="jade-launch-splash" role="status" aria-label="Ouverture de Jade">
    <img src="/assets/splash-jade.png" alt="" fetchpriority="high" decoding="async">
  </div>

  <div id="auth-modal" class="auth-layer" role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <form id="auth-form" class="auth-card" novalidate>
      <div class="auth-heading">
        <img class="auth-icon" src="/icon.svg" width="44" height="44" alt="">
        <h1 id="auth-title">Espace privé de Jade</h1>
      </div>
      <label for="auth-token">Jeton d'accès</label>
      <input id="auth-token" type="password" required minlength="32" maxlength="256" autocomplete="off" spellcheck="false">
      <button class="unlock" type="submit">Entrer dans le salon</button>
      <output id="auth-feedback" role="status" aria-live="polite"></output>
    </form>
  </div>
</body>
</html>
